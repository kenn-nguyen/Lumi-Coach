services:
  - type: web
    name: som-career-coach
    runtime: python
    rootDir: apps/backend
    buildCommand: pip install . && PLAYWRIGHT_BROWSERS_PATH=0 python -m playwright install chromium
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_LLM
        value: WARNING
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: FRONTEND_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BACKEND_AUTH_SHARED_SECRET
        sync: false
      - key: AUTH_TOKEN_ISSUER
        value: resume-matcher-frontend
      - key: AUTH_TOKEN_AUDIENCE
        value: resume-matcher-backend
      - key: AUTH_TOKEN_TTL_SECONDS
        value: "900"
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-5-nano-2025-08-07
      - key: LLM_API_KEY
        sync: false

      # --- job tracker ---------------------------------------------------
      # The one Google account that may use the tracker. With the dev bypass
      # off, this is the only way in: set it to the address you sign in with,
      # or you will be locked out of your own queue.
      - key: TRACKER_OWNER_EMAIL
        sync: false
      # The Vertex service account, as the JSON itself. There is nowhere to put
      # a key file here, so the scorer parses it from the environment rather
      # than writing it to disk.
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      # Caps on one run. The lookback window is the real cost lever; these stop
      # a misconfiguration from being expensive.
      - key: TRACKER_MAX_ITEMS_PER_RUN
        value: "200"
      - key: TRACKER_MAX_SCORED_PER_RUN
        value: "120"
      # TRACKER_DEV_NO_AUTH is deliberately absent. The backend refuses it on a
      # deployed host anyway, but it should not be here to be switched on.

  # Scheduled runs go in their own process. A run started from the web service
  # keeps it alive and blocks a deploy; this one cannot.
  - type: cron
    name: som-career-coach-tracker
    runtime: python
    rootDir: apps/backend
    schedule: "0 */6 * * *"
    buildCommand: pip install .
    startCommand: python scripts/run_pipeline.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TRACKER_OWNER_EMAIL
        sync: false
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: TRACKER_MAX_ITEMS_PER_RUN
        value: "200"
      - key: TRACKER_MAX_SCORED_PER_RUN
        value: "120"
