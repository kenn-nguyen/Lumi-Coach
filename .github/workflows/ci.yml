name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned rather than following "latest": a CI that changes runtime on
          # its own turns an unrelated failure into a mystery.
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - run: npm ci

      # vitest runs through jsdom and never type-checks, so a prop called with
      # the wrong arguments passes every test and still breaks the build.
      - name: Type-check
        run: npm run typecheck

      - name: Tests
        run: npm test

  backend:
    name: Backend (tracker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tracker_ci
        ports:
          - 5432:5432
        # Without this the first step can reach the port before the server is
        # ready to answer, which fails as a connection error rather than a test.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # The database name must contain a disposable marker: both the test
      # fixtures and the seed script refuse to touch anything else.
      TRACKER_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/tracker_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: apps/backend/requirements-tracker.txt

      - run: pip install -r requirements-tracker.txt

      # The API tests are gated on tracker_jobs having rows. Against an empty
      # database they skip rather than fail, so without this the suite would
      # report green while 44 tests never ran.
      - name: Seed the database
        run: python scripts/seed_test_db.py

      - name: Tests
        run: python -m pytest tests/tracker -q
