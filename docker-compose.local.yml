# Own project name: docker-compose.dev.yml also has a "postgres" service, and
# sharing the default project would make each file replace the other's container.
name: lumi-local

services:
  postgres:
    # Matches the production (Neon) major version so its dumps restore cleanly.
    image: postgres:17
    container_name: som-career-coach-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: som_career_coach
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Override when 5432 is already taken, e.g. POSTGRES_PORT=5434.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - som-career-coach-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d som_career_coach"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  som-career-coach-postgres-data:
