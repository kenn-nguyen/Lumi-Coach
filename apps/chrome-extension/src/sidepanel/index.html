<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumi Coach</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="panel">
      <header class="panel__header">
        <p class="panel__eyebrow">Lumi Coach</p>
        <h1>Quick Helper</h1>
        <p>The LinkedIn board is the main place to tailor, recover setup, and run jobs.</p>
      </header>

      <section class="card card--hero">
        <div class="card__intro">
          <h2 id="helper-title">Open a LinkedIn job</h2>
          <p id="helper-detail">
            Use the LinkedIn board for onboarding, recovery, and tailoring.
          </p>
        </div>

        <div class="asset-group">
          <div class="asset-row">
            <span class="asset-row__label">Google sign-in</span>
            <span id="helper-auth-status" class="asset-row__value"></span>
          </div>
          <div class="asset-row">
            <span class="asset-row__label">Resume</span>
            <span id="helper-resume-status" class="asset-row__value"></span>
          </div>
          <div class="asset-row">
            <span class="asset-row__label">Provider</span>
            <span id="helper-provider-status" class="asset-row__value"></span>
          </div>
          <div class="asset-row">
            <span class="asset-row__label">Story bank</span>
            <span id="helper-storyboard-status" class="asset-row__value"></span>
          </div>
        </div>

        <div class="setup-actions">
          <button id="helper-primary-action" class="button" type="button">
            Open LinkedIn job
          </button>
          <button
            id="helper-secondary-action"
            class="button button--secondary"
            type="button"
            hidden
          ></button>
        </div>
      </section>

      <section class="card">
        <div class="card__intro card__intro--compact">
          <h2>Web</h2>
          <p>History and full review stay on the website.</p>
        </div>
        <div class="setup-actions">
          <button id="open-app-action" class="button button--secondary" type="button">
            Open Lumi Coach
          </button>
          <button
            id="open-history-action"
            class="button button--secondary"
            type="button"
          >
            Open history on web
          </button>
        </div>
      </section>
    </main>

    <script type="module" src="./panel.js"></script>
  </body>
</html>
