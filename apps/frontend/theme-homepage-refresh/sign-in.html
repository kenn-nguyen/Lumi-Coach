<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In Theme Preview</title>
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./preview-shared.css" />
    <style>
      .auth-wrap { min-height: calc(100vh - 64px); display:grid; place-items:center; }
      .auth-card { width:min(520px,calc(100vw - 48px)); border:1px solid var(--thr-border-soft); background:rgba(255,255,255,0.9); padding:36px; border-radius:var(--thr-radius-lg); box-shadow:var(--thr-shadow-lg); text-align:center; }
      .auth-card h1 { margin:18px auto 10px; max-width:10ch; font-size:54px; }
    </style>
  </head>
  <body class="thr-preview-page">
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="thr-eyebrow">SOM Career Coach</div>
        <h1 class="thr-title-xl thr-title-xl--brand">Sign in</h1>
        <p class="thr-muted">Continue with Google to access your resumes and generated documents.</p>
        <div style="margin-top:28px;">
          <a class="thr-pill-action thr-pill-action--primary" href="#" style="min-width:260px;">Continue with Google</a>
        </div>
        <div style="margin-top:24px;">
          <a class="thr-pill-action" href="./preview.html">Back to homepage</a>
        </div>
      </div>
    </div>
  </body>
  </html>
