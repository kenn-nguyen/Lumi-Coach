<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailor Theme Preview</title>
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./preview-shared.css" />
    <style>
      .tailor-wrap { max-width: 980px; margin: 0 auto; }
      .tailor-card { padding: 42px 44px; border:1px solid var(--thr-border-soft); background:#fffdf8; box-shadow:var(--thr-shadow-md); }
      .tailor-head { position:relative; text-align:center; margin-bottom:28px; }
      .tailor-back { position:absolute; top:0; left:0; }
      .tailor-section { margin-top:24px; }
      .counter { position:absolute; right:12px; bottom:12px; font-size:12px; color:var(--thr-text-muted); }
      .warning { display:flex; gap:14px; align-items:flex-start; border:1px solid rgba(181,106,23,0.18); background:#fff7ea; padding:16px; border-radius:12px; }
    </style>
  </head>
  <body class="thr-preview-page thr-mode-work">
    <div class="tailor-wrap">
      <div class="tailor-card">
        <div class="tailor-head">
          <a class="thr-pill-action tailor-back" href="./dashboard.html">Back</a>
          <h1 style="margin:20px auto 10px;max-width:none;font-size:56px;background:none;color:var(--thr-text-primary);-webkit-background-clip:initial;background-clip:initial;">Tailor Resume</h1>
          <div class="thr-brand-subtitle">// Paste the job description below</div>
        </div>

        <div class="warning">
          <div style="width:12px;height:12px;background:#c97819;margin-top:4px;"></div>
          <div>
            <div class="thr-mono" style="color:#8b5a14;">Setup Required</div>
            <div class="thr-screen-note" style="margin-top:6px;color:#7a642f;">The warning banner stays in the same location when the provider is not configured. It just uses a lighter premium treatment.</div>
          </div>
        </div>

        <div class="tailor-section">
          <div class="thr-mono" style="margin-bottom:8px;">Prompt Strategy</div>
          <select class="thr-select">
            <option>Keywords / Balanced alignment</option>
          </select>
        </div>

        <div class="tailor-section" style="position:relative;">
          <textarea class="thr-textarea" style="min-height:320px;">Product Manager | Generalist (All Levels)

Ramp is looking for a PM who can move from ambiguous opportunity sizing through shipping and operating metrics. You will work closely with engineering, design, sales, and operations to improve financial workflows, build internal leverage, and unlock new product value...</textarea>
          <div class="counter">6420 characters</div>
        </div>

        <div class="tailor-section">
          <a class="thr-pill-action thr-pill-action--primary" href="#" style="width:100%;padding-top:16px;padding-bottom:16px;">Generate Tailored Resume</a>
        </div>
      </div>
    </div>
  </body>
  </html>
